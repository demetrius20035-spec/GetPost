[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "getpost"
version = "2.1.0"
description = "GUI- и CLI-клиент для HTTP-запросов (аналог Postman/Insomnia) на Python и Qt"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["http", "rest", "api", "client", "gui", "qt", "postman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
# GUI требует один из биндингов Qt (по умолчанию PySide6).
gui = ["PySide6>=6.5"]
pyqt = ["PyQt6>=6.5"]
dev = ["pyflakes"]

[project.scripts]
getpost = "getpost:main"

[project.gui-scripts]
getpost-gui = "getpost_gui.app:main"

[tool.setuptools]
packages = ["getpost_gui", "getpost_gui.views"]
py-modules = ["getpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
